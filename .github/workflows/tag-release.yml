name: Tag release

# Consumers pin a tag: an app installs one with npm, or serves its dist/
# (see the readme's "Consuming it"). Every push to main is a new thing a
# consumer could pin to, so every push to main gets the next v1.0.x release
# automatically.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # puppeteer (used by the e2e suite) downloads its own Chromium binary
      # (~200MB+) as part of `npm ci`, into ~/.cache/puppeteer by default
      # since v19+ - separate from npm's own package cache above, and the
      # single biggest chunk of install time on a cold runner. This fires
      # on every push to main, so without caching it that download repeats
      # every single time, not just once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - run: npm ci

      # Same `npm test` a dev runs locally (stencil test --spec --e2e) -
      # a broken build never gets tagged, so a consuming app pinning to
      # whatever tag is newest can't pin to something broken.
      - run: npm test

      # The tag goes on a release commit carrying the same version in
      # package.json, which is what an app installing the tag with npm sees.
      # Pushed to main too, so main stays at the newest tag and a checkout of
      # main is always a release. A push made with GITHUB_TOKEN starts no
      # workflow, so this doesn't run again.
      - name: Commit, tag and push the next v1.0.x release
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v1.0.*' | sed 's/^v1\.0\.//' | sort -n | tail -1)
          latest=${latest:-0}
          new_tag="v1.0.$((latest + 1))"
          echo "new_tag=$new_tag" >> "$GITHUB_ENV"
          npm version "${new_tag#v}" --no-git-tag-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: release $new_tag" package.json package-lock.json
          git tag "$new_tag"
          echo "Tagging $new_tag at $(git rev-parse HEAD)"
          git push origin HEAD:main "$new_tag"

      # Consumers only need the tag pushed above - a GitHub
      # Release is a separate, optional layer on top (release notes, a
      # "latest" marker in the GitHub UI). Not functionally required, but
      # most past tags here do have one, so this keeps matching that.
      - name: Create a GitHub Release for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$new_tag" --generate-notes
